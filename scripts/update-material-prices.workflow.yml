name: Update Material Prices

on:
  schedule:
    # TR saati ~08:00, 14:00, 20:00, 02:00 (UTC)
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scrape_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/material_prices.json LevKonutSantiyeAsistani/Resources/material_prices.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "chore: update material prices feed"
            git push
          fi
